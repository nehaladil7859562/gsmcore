<!DOCTYPE html>
<html>
<head>
  <title>Login</title>

  <style>
    body {
      margin: 0;
      font-family: Arial;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #0f172a;
    }

    .box {
      width: 340px;
      background: #1e293b;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 0 20px rgba(0,0,0,0.4);
      color: white;
    }

    h2 {
      text-align: center;
    }

    input {
      width: 100%;
      padding: 10px;
      margin: 8px 0;
      border-radius: 6px;
      border: none;
    }

    .password-box {
      position: relative;
    }

    .toggle {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      cursor: pointer;
    }

    button {
      width: 100%;
      padding: 10px;
      background: #22c55e;
      border: none;
      color: white;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 10px;
    }

    button:hover {
      background: #16a34a;
    }

    a {
      display: block;
      text-align: center;
      margin-top: 10px;
      color: #ccc;
      text-decoration: none;
    }
  </style>
</head>

<body>

<div class="box">
  <h2>Login</h2>

  <form method="POST">
    <input type="text" name="username" placeholder="Username" required>

    <div class="password-box">
      <input type="password" id="pass" name="password" placeholder="Password" required>
      <span class="toggle" onclick="togglePass()">👁️</span>
    </div>

    <button type="submit">Login</button>
  </form>

  <a href="/register">Don't have an account? Register</a>
</div>

<script>
function togglePass() {
  let p = document.getElementById("pass");
  p.type = (p.type === "password") ? "text" : "password";
}
</script>

</body>
</html>
