<!DOCTYPE html>
<html>
<head>
<title>Login</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: linear-gradient(135deg, #0f172a, #1e293b);
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
}

form {
  background: rgba(255,255,255,0.08);
  backdrop-filter: blur(10px);
  padding: 30px;
  border-radius: 16px;
  width: 320px;
  text-align: center;
  box-shadow: 0 0 25px rgba(0,0,0,0.4);
}

h2 { color: white; }

input {
  width: 90%;
  padding: 12px;
  margin: 8px 0;
  border: none;
  border-radius: 8px;
}

button {
  width: 100%;
  padding: 12px;
  background: #22c55e;
  border: none;
  border-radius: 8px;
  color: white;
}

.error {
  color: #ff4d4d;
  margin-bottom: 10px;
  font-weight: bold;
}

p {
  color: white;
  margin-top: 15px;
}

a {
  color: #22c55e;
  text-decoration: none;
}
</style>

</head>

<body>

<form method="POST">

  <h2>Login</h2>

  {% if error %}
  <div class="error">{{ error }}</div>
  {% endif %}

  <input type="text" name="username" placeholder="Username" required>

  <input type="password" name="password" placeholder="Password" required>

  <button type="submit">Login</button>

  <!-- ALWAYS REGISTER LINK -->
  <p>
    Don’t have an account?
    <a href="/register">Register</a>
  </p>

</form>

</body>
</html>
