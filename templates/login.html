<!DOCTYPE html>
<html>
<head>
<title>Login</title>

<style>
body {
  font-family: Arial;
  background: #0f172a;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  color: white;
}

form {
  background: #1e293b;
  padding: 30px;
  border-radius: 12px;
  width: 300px;
  text-align: center;
}

input {
  width: 90%;
  padding: 10px;
  margin: 10px;
  border-radius: 6px;
  border: none;
}

button {
  padding: 10px;
  width: 100%;
  background: #22c55e;
  border: none;
  border-radius: 6px;
  color: white;
}

.error {
  color: red;
  text-align: center;
  margin-bottom: 10px;
  font-weight: bold;
}
</style>

</head>
<body>

<form method="POST">

  <h2>Login</h2>

  {% if error %}
  <div class="error">{{ error }}</div>
  {% endif %}

  <input type="text" name="username" placeholder="Username" required>

  <div style="position: relative;">
    <input type="password" id="password" name="password" placeholder="Password" required>
    <span onclick="togglePassword()" style="
      position:absolute;
      right:15px;
      top:50%;
      transform:translateY(-50%);
      cursor:pointer;
    ">👁️</span>
  </div>

  <button type="submit">Login</button>

</form>

<script>
function togglePassword() {
  var x = document.getElementById("password");
  if (x.type === "password") {
    x.type = "text";
  } else {
    x.type = "password";
  }
}
</script>

</body>
</html>
