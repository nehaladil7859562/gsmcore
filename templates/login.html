<!DOCTYPE html>
<html>
<head>
  <title>Login</title>

  <style>
    body {
      margin: 0;
      font-family: Arial;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f2f2f2;
    }

    .box {
      width: 340px;
      background: white;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 0 15px rgba(0,0,0,0.1);
    }

    h2 {
      text-align: left;
      margin-bottom: 15px;
    }

    input {
      width: 100%;
      padding: 10px;
      margin: 8px 0;
      border: 1px solid #ccc;
      border-radius: 6px;
      box-sizing: border-box;
    }

    .password-box {
      position: relative;
    }

    .toggle {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      cursor: pointer;
    }

    button {
      width: 100%;
      padding: 10px;
      background: black;
      color: white;
      border: none;
      border-radius: 6px;
      margin-top: 10px;
      cursor: pointer;
    }

    button:hover {
      background: #222;
    }

    a {
      display: block;
      text-align: center;
      margin-top: 10px;
      font-size: 14px;
    }
  </style>
</head>

<body>

<div class="box">

  <h2>Login</h2>

  <form method="POST">

    <input type="text" name="username" placeholder="Username" required>

    <div class="password-box">
      <input type="password" id="loginPass" name="password" placeholder="Password" required>
      <span class="toggle" onclick="togglePass()">👁️</span>
    </div>

    <button type="submit">Login</button>
  </form>

  <a href="/register">Don't have an account? Register</a>

</div>

<script>
function togglePass() {
  let p = document.getElementById("loginPass");
  p.type = (p.type === "password") ? "text" : "password";
}
</script>

</body>
</html>
