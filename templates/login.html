<!DOCTYPE html>
<html>
<head>
  <title>Login</title>

  <style>
    body {
      font-family: Arial;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: #f2f2f2;
    }

    .box {
      background: white;
      padding: 20px;
      width: 300px;
      border-radius: 10px;
      box-shadow: 0px 0px 10px #ccc;
    }

    input {
      width: 100%;
      padding: 10px;
      margin: 8px 0;
    }

    .password-box {
      position: relative;
    }

    .toggle {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      cursor: pointer;
    }

    button {
      width: 100%;
      padding: 10px;
      background: black;
      color: white;
      border: none;
      margin-top: 10px;
    }

    a {
      display: block;
      margin-top: 10px;
      text-align: center;
    }
  </style>
</head>

<body>

<div class="box">
  <h2>Login</h2>

  <form method="POST">

    <input type="text" name="username" placeholder="Username" required>

    <div class="password-box">
      <input type="password" id="loginPass" name="password" placeholder="Password" required>
      <span class="toggle" onclick="togglePass()">👁️</span>
    </div>

    <button type="submit">Login</button>
  </form>

  <a href="/register">Don't have an account? Register</a>
</div>

<script>
function togglePass() {
  let p = document.getElementById("loginPass");
  p.type = (p.type === "password") ? "text" : "password";
}
</script>

</body>
</html>
