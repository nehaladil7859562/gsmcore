<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>GsmCore Dashboard</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      min-height: 100vh;

      /* 🔥 Gradient + Pattern Background */
      background: linear-gradient(135deg, #eef2f3, #dfe9f3);
      background-image: 
        radial-gradient(circle at 25% 25%, rgba(0,123,255,0.1) 2px, transparent 2px),
        radial-gradient(circle at 75% 75%, rgba(0,123,255,0.1) 2px, transparent 2px);
      background-size: 60px 60px;
    }

    /* 🔵 Navbar */
    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 30px;
      background-color: #007bff;
      color: white;
    }

    .navbar .left img {
      width: 40px;
    }

    .navbar .right {
      display: flex;
      align-items: center;
    }

    .navbar span {
      margin-right: 15px;
      font-weight: bold;
    }

    .navbar a {
      text-decoration: none;
      color: white;
      background-color: #dc3545;
      padding: 8px 15px;
      border-radius: 6px;
      font-size: 14px;
    }

    .navbar a:hover {
      background-color: darkred;
    }

    /* 🖼️ Logo Center */
    .logo {
      text-align: center;
      margin-top: 30px;
    }

    .logo img {
      width: 200px;
    }

    /* ✨ Welcome Text */
    .welcome {
      text-align: center;
      margin-top: 10px;
      color: #333;
    }

    /* 📦 Dashboard Grid */
    .dashboard {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      padding: 40px;
      max-width: 1100px;
      margin: auto;
    }

    /* 🧊 Cards */
    .card {
      background: white;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0px 10px 25px rgba(0,0,0,0.1);
      text-align: center;
      transition: 0.3s;
    }

    .card:hover {
      transform: translateY(-6px);
      box-shadow: 0px 15px 30px rgba(0,0,0,0.2);
    }

    .card h2 {
      color: #007bff;
      margin-bottom: 10px;
    }

    .card p {
      color: #555;
    }
  </style>
</head>

<body>

  <!-- 🔵 Navbar -->
  <div class="navbar">
    <div class="left">
      <img src="{{ url_for('static', filename='image.png') }}" alt="logo">
    </div>

    <div class="right">
      <span>👋 {{ user }}</span>
      <a href="/logout">Logout</a>
    </div>
  </div>

  <!-- 🖼️ Center Logo -->
  <div class="logo">
    <img src="{{ url_for('static', filename='image.png') }}" alt="GsmCore Logo">
  </div>

  <!-- ✨ Welcome -->
  <div class="welcome">
    <h2>Your dashboard is ready 🚀</h2>
  </div>

  <!-- 📦 Dashboard Cards -->
  <div class="dashboard">

    <div class="card">
      <h2>🔓 Unlock Tool</h2>
      <p>Unlock your device safely</p>
    </div>

    <div class="card">
      <h2>📱 IMEI Tool</h2>
      <p>Check device information</p>
    </div>

    <div class="card">
      <h2>⚙️ GSM Tool</h2>
      <p>Advanced mobile utilities</p>
    </div>

    <div class="card">
      <h2>🧠 Smart Tool</h2>
      <p>Automation & smart features</p>
    </div>

  </div>

</body>
</html>
