<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>GsmCore Dashboard</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #eef2f3, #dfe9f3);
      min-height: 100vh;
    }

    /* Navbar */
    .navbar {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      padding: 20px 40px;
      background-color: #007bff;
      color: white;
    }

    .navbar span {
      margin-right: 15px;
      font-weight: bold;
    }

    .navbar a {
      text-decoration: none;
      color: white;
      background-color: #dc3545;
      padding: 8px 15px;
      border-radius: 6px;
      font-size: 14px;
    }

    .navbar a:hover {
      background-color: darkred;
    }

    /* Dashboard Container */
    .dashboard {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      padding: 40px;
      max-width: 1200px;
      margin: auto;
    }

    /* Card Style */
    .card {
      background: white;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0px 10px 25px rgba(0,0,0,0.1);
      text-align: center;
      transition: transform 0.3s, box-shadow 0.3s;
    }

    .card:hover {
      transform: translateY(-5px);
      box-shadow: 0px 15px 30px rgba(0,0,0,0.15);
    }

    .card h2 {
      margin: 10px 0;
      color: #007bff;
    }

    .card p {
      color: #555;
    }

    /* Welcome Message */
    .welcome {
      text-align: center;
      margin-top: 40px;
      color: #222;
    }

  </style>
</head>
<body>

  <!-- Navbar -->
  <div class="navbar">
    <span>👋 {{ user }}</span>
    <a href="/logout">Logout</a>
  </div>

  <!-- Welcome -->
  <div class="welcome">
    <h1>WELCOME TO GsmCore</h1>
    <p>Your dashboard is ready 🚀</p>
  </div>

  <!-- Dashboard Cards -->
  <div class="dashboard">
    <div class="card">
      <h2>Tool 1</h2>
      <p>Some description about Tool 1</p>
    </div>
    <div class="card">
      <h2>Tool 2</h2>
      <p>Some description about Tool 2</p>
    </div>
    <div class="card">
      <h2>Tool 3</h2>
      <p>Some description about Tool 3</p>
    </div>
    <div class="card">
      <h2>Tool 4</h2>
      <p>Some description about Tool 4</p>
    </div>
  </div>

</body>
</html>
