<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #0f172a;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .box {
            background: #1e293b;
            padding: 25px;
            border-radius: 12px;
            width: 320px;
            box-shadow: 0 0 20px rgba(0,0,0,0.4);
        }

        h2 {
            text-align: center;
            color: white;
            margin-bottom: 20px;
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            border: none;
            border-radius: 6px;
            outline: none;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            border: none;
            border-radius: 6px;
            background: #22c55e;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #16a34a;
        }

        .link {
            text-align: center;
            margin-top: 10px;
            color: #cbd5e1;
            font-size: 14px;
        }

        .link a {
            color: #38bdf8;
            text-decoration: none;
        }

        /* 🔐 PASSWORD BOX FIX */
        .password-box {
            position: relative;
            width: 100%;
        }

        .password-box input {
            padding-right: 40px;
        }

        .password-box .toggle {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            font-size: 18px;
            user-select: none;
        }
    </style>
</head>

<body>

<div class="box">
    <h2>Register</h2>

    <form method="POST">

        <input type="text" name="username" placeholder="Username" required>

        <!-- 🔐 PASSWORD FIELD (FIXED) -->
        <div class="password-box">
            <input type="password" id="password" name="password" placeholder="Password" required>
            <span class="toggle" onclick="togglePassword()">👁️</span>
        </div>

        <input type="text" name="phone" placeholder="Phone" required>

        <input type="text" name="location" placeholder="Location" required>

        <input type="email" name="email" placeholder="Email Address" required>

        <button type="submit">Register</button>

    </form>

    <div class="link">
        Already have an account? <a href="/login">Login</a>
    </div>
</div>

<!-- ⚙️ PASSWORD TOGGLE SCRIPT -->
<script>
function togglePassword() {
    var pass = document.getElementById("password");

    if (pass.type === "password") {
        pass.type = "text";
    } else {
        pass.type = "password";
    }
}
</script>

</body>
</html>
