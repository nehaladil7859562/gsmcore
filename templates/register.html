<!DOCTYPE html>
<html>
<head>
  <title>Register</title>

  <style>
    body {
      margin: 0;
      font-family: Arial;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #0f172a;
    }

    .box {
      width: 350px;
      background: #1e293b;
      padding: 25px;
      border-radius: 12px;
      color: white;
    }

    input {
      width: 100%;
      padding: 10px;
      margin: 8px 0;
      border-radius: 6px;
      border: none;
    }

    .password-box {
      position: relative;
    }

    .toggle {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      cursor: pointer;
    }

    button {
      width: 100%;
      padding: 10px;
      background: #22c55e;
      border: none;
      color: white;
      border-radius: 6px;
      cursor: pointer;
    }
  </style>
</head>

<body>

<div class="box">
  <h2>Register</h2>

  <form method="POST">
    <input type="text" name="username" placeholder="Username" required>

    <div class="password-box">
      <input type="password" id="pass" name="password" placeholder="Password" required>
      <span class="toggle" onclick="togglePass()">👁️</span>
    </div>

    <input type="text" name="phone" placeholder="Phone" required>
    <input type="text" name="location" placeholder="Location" required>
    <input type="email" name="email" placeholder="Email" required>

    <button type="submit">Register</button>
  </form>
</div>

<script>
function togglePass() {
  let p = document.getElementById("pass");
  p.type = (p.type === "password") ? "text" : "password";
}
</script>

</body>
</html>
