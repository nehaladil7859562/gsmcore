<!DOCTYPE html>
<html>
<head>
<title>Register</title>

<style>
body {
  font-family: Arial;
  background: #0f172a;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  color: white;
}

form {
  background: #1e293b;
  padding: 30px;
  border-radius: 12px;
  width: 300px;
  text-align: center;
}

input {
  width: 90%;
  padding: 10px;
  margin: 10px;
  border-radius: 6px;
  border: none;
}

button {
  padding: 10px;
  width: 100%;
  background: #22c55e;
  border: none;
  border-radius: 6px;
  color: white;
}
</style>

</head>
<body>

<form method="POST">

  <h2>Register</h2>

  <input type="text" name="username" placeholder="Username" required>
  <input type="password" name="password" placeholder="Password" required>
  <input type="text" name="phone" placeholder="Phone Number" required>
  <input type="text" name="location" placeholder="Location" required>

  <button type="submit">Register</button>

</form>

</body>
</html>
