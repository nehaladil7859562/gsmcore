<!DOCTYPE html>
<html>
<head>
  <title>Verify OTP</title>

  <style>
    body {
      margin: 0;
      font-family: Arial;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #0f172a;
    }

    .box {
      width: 320px;
      background: #1e293b;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 0 25px rgba(0,0,0,0.5);
      text-align: center;
      color: white;
      animation: pop 0.3s ease;
    }

    h2 {
      margin-bottom: 10px;
    }

    p {
      font-size: 14px;
      margin-bottom: 15px;
      opacity: 0.8;
    }

    input {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 6px;
      margin-bottom: 15px;
      text-align: center;
      font-size: 18px;
      letter-spacing: 5px;
    }

    button {
      width: 100%;
      padding: 10px;
      background: #22c55e;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }

    button:hover {
      background: #16a34a;
    }

    @keyframes pop {
      from { transform: scale(0.7); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
  </style>
</head>

<body>

<div class="box">
  <h2>Verify OTP</h2>

  <p>Enter the OTP that has been sent to your email address</p>

  <form method="POST">
    <input type="text" name="otp" maxlength="4" placeholder="----" required>
    <button type="submit">Verify</button>
  </form>
</div>

</body>
</html>
