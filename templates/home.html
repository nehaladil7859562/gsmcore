<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>GsmCore</title>

  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      background: linear-gradient(135deg, #eef2f3, #dfe9f3);
      font-family: Arial, sans-serif;
      text-align: center;
    }

    /* 🔥 Navbar */
    .navbar {
      position: absolute;
      top: 20px;
      right: 20px;
    }

    .navbar a {
      text-decoration: none;
      padding: 8px 15px;
      border-radius: 6px;
      font-size: 14px;
      margin-left: 10px;
    }

    .login {
      background-color: #007bff;
      color: white;
    }

    .register {
      border: 1px solid #007bff;
      color: #007bff;
    }

    .register:hover {
      background-color: #007bff;
      color: white;
    }

    /* ✨ Welcome text */
    h1 {
      font-size: 40px;
      color: #333;
      margin-bottom: 20px;
    }

    /* 🔥 Logo */
    .logo img {
      width: 350px;
      max-width: 90%;
    }

    /* Tagline */
    p {
      font-size: 18px;
      color: #555;
      margin-top: 20px;
    }

  </style>
</head>

<body>

  <!-- 🔥 Navbar -->
  <div class="navbar">
    <a href="/login" class="login">Login</a>
    <a href="/register" class="register">Register</a>
  </div>

  <!-- ✨ Welcome -->
  <h1>WELCOME TO</h1>

  <!-- 🔥 YAHAN LOGO (GsmCore text ki jagah) -->
  <div class="logo">
    <img src="{{ url_for('static', filename='image.png') }}" alt="GsmCore Logo">
  </div>

  <!-- Tagline -->
  <p>Powering your device freedom ⚡📱</p>

</body>
</html>
